name: Inspect JIT Source Code

on:
  push:
  workflow_dispatch:

jobs:
  inspect-jit:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Upstream Source
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Extract All JIT Code and Scripts to TXT
        shell: python3 {0}
        run: |
          from pathlib import Path

          out_dir = Path("report")
          out_dir.mkdir(exist_ok=True)
          chunks = []
          js_files = []

          exts = (".swift", ".c", ".h", ".m", ".mm", ".js", ".md")

          for p in sorted(Path("upstream").rglob("*")):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if ".git" in p.parts or "linux" in p.parts:
                  continue
              txt = p.read_text(encoding="utf-8", errors="ignore")
              low = txt.lower()
              if p.suffix.lower() == ".js":
                  js_files.append(f"=== JS FILE: {p} ===\n{txt}\n")
              if "stikdebug" in low or "without jit" in low or "jit" in p.name.lower():
                  chunks.append(f"=== FILE: {p} ===\n{txt[:12000]}\n")
              elif any(k in low for k in ("stik", "p_traced")):
                  chunks.append(f"=== MATCH: {p} ===\n{txt[:8000]}\n")

          (out_dir / "jit-source-code.txt").write_text(
              "\n".join(chunks) if chunks else "No matches found\n",
              encoding="utf-8",
          )
          (out_dir / "jit-scripts.txt").write_text(
              "\n".join(js_files) if js_files else "No JS files in repo\n",
              encoding="utf-8",
          )

      - name: Step 3 - Upload JIT Code Report
        uses: actions/upload-artifact@v4
        with:
          name: JIT-Code-Report
          path: report/
