name: Inspect Graphics Cache Code

on:
  push:
  workflow_dispatch:

jobs:
  inspect-gfx:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Upstream Source
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Inspect App Bundle and Graphics Code
        shell: python3 {0}
        run: |
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          out_dir = Path("report")
          out_dir.mkdir(exist_ok=True)

          api = "https://api.github.com/repos/imxieyi/Kernarium/releases"
          with urllib.request.urlopen(api) as r:
              rels = json.loads(r.read().decode("utf-8"))
          ipa_url = next(
              a["browser_download_url"]
              for rel in rels
              for a in rel.get("assets", [])
              if a["name"].endswith(".ipa")
          )
          urllib.request.urlretrieve(ipa_url, "Andarium.ipa")

          app_files = []
          with zipfile.ZipFile("Andarium.ipa") as zf:
              for info in zf.infolist():
                  app_files.append(f"{info.file_size:>12}  {info.filename}")

          (out_dir / "app-structure.txt").write_text(
              "\n".join(app_files) + "\n", encoding="utf-8"
          )

          chunks = []
          keys = ("mesa", "kosmic", "virgl", "venus", "shader", "cache", "setenv", "xcode")
          exts = (".swift", ".c", ".cpp", ".h", ".m", ".mm", ".py", ".sh", ".md", ".yml")

          for p in sorted(Path("upstream").rglob("*")):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if ".git" in p.parts or "linux" in p.parts:
                  continue
              txt = p.read_text(encoding="utf-8", errors="ignore")
              low = txt.lower()
              if any(k in low for k in keys) or any(k in p.name.lower() for k in keys):
                  chunks.append(f"=== FILE: {p} ===\n{txt[:10000]}\n")

          (out_dir / "gfx-source-code.txt").write_text(
              "\n".join(chunks[:30]) if chunks else "No matches\n",
              encoding="utf-8",
          )

      - name: Step 3 - Upload Graphics Report
        uses: actions/upload-artifact@v4
        with:
          name: Graphics-Cache-Report
          path: report/
