name: Build Low RAM GPT System IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-lowram-gpt:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Tools and Unpack Official IPA
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs erofs-utils gdisk attr util-linux unzip zip wget curl jq
          sudo modprobe erofs || true

          mkdir -p work report
          API="https://api.github.com/repos/imxieyi/Kernarium/releases"
          Q='[.[] | .assets[]? | select(.name | endswith(".ipa")) | .browser_download_url][0]'
          IPA_URL=$(curl -sL "$API" | jq -r "$Q")
          echo "Downloading IPA: $IPA_URL"
          wget -q -O Andarium.ipa "$IPA_URL" || curl -fL -o Andarium.ipa "$IPA_URL"
          unzip -q -o Andarium.ipa -d work
          if [ ! -d "work/Payload/Andarium.app/andarium-system" ]; then
            echo "ERROR: andarium-system folder missing"
            exit 1
          fi
          exit 0

      - name: Step 2 - Rebuild GPT Partitions with Low RAM Config
        shell: python3 {0}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          bsys = Path("work/Payload/Andarium.app/andarium-system")
          layout_p = bsys / "guest/partition-layout.json"
          manifest_p = bsys / "release-manifest.json"
          disk_p = bsys / "guest/system.img"
          logs = []

          def log(msg):
              print(msg, flush=True)
              logs.append(msg)

          def sha256_f(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda: f.read(4194304), b""):
                      h.update(b)
              return h.hexdigest()

          def run(cmd, check=True):
              log("+ " + " ".join(str(x) for x in cmd))
              return subprocess.run(cmd, check=check)

          layout = json.loads(layout_p.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_p.read_text(encoding="utf-8"))
          sd = layout["system_disk"]
          parts = sd["partitions"]

          pdir = Path("/tmp/gpt_parts")
          pdir.mkdir(parents=True, exist_ok=True)

          with disk_p.open("rb") as df:
              for p in parts:
                  out = pdir / (p["name"] + ".img")
                  df.seek(p["start_bytes"])
                  rem = p["size_bytes"]
                  with out.open("wb") as wf:
                      while rem > 0:
                          c = df.read(min(4194304, rem))
                          if not c:
                              break
                          wf.write(c)
                          rem -= len(c)
                  log(f"Extracted {p['name']}: {out.stat().st_size} bytes")

          APPS = [
              "ExactCalculator", "Calculator", "Etar", "Calendar",
              "DeskClock", "Gallery2", "Glimpse", "Eleven", "Music",
              "Aperture", "Camera2", "Contacts", "Messaging",
              "Recorder", "Email", "PhotoTable", "BasicDreams",
              "LiveWallpapersPicker", "EasterEgg",
          ]

          LOWRAM_PROPS = "\n".join([
              "",
              "# Low-RAM Configuration",
              "ro.config.low_ram=true",
              "ro.sys.fw.bg_apps_limit=2",
              "ro.config.max_starting_bg=1",
              "dalvik.vm.heapstartsize=4m",
              "dalvik.vm.heapgrowthlimit=128m",
              "dalvik.vm.heapsize=384m",
              "debug.sf.nobootanimation=1",
              "persist.sys.sf.disable_blurs=1",
              "ro.surface_flinger.supports_background_blur=0",
              "ro.surface_flinger.max_frame_buffer_acquired_buffers=2",
              "",
          ])

          def optimize_dir(root):
              bases = [root]
              sys_sub = root / "system"
              if sys_sub.is_dir() and not sys_sub.is_symlink():
                  bases.append(sys_sub)
              for b in bases:
                  for folder in ("app", "priv-app"):
                      d = b / folder
                      if d.is_dir() and not d.is_symlink():
                          for a in APPS:
                              t = d / a
                              if t.exists():
                                  log(f"Removed app: {t}")
                                  run(["sudo", "rm", "-rf", str(t)])
                  fdir = b / "fonts"
                  if fdir.is_dir() and not fdir.is_symlink():
                      for pat in ("NotoSansCJK*", "NotoSerifCJK*"):
                          for fp in fdir.glob(pat):
                              log(f"Removed font: {fp.name}")
                              run(["sudo", "rm", "-f", str(fp)])
                  ba = b / "media/bootanimation.zip"
                  if ba.exists():
                      log(f"Removed bootanimation: {ba}")
                      run(["sudo", "rm", "-f", str(ba)])
                  for rel in ("build.prop", "etc/build.prop"):
                      bp = b / rel
                      if bp.is_file() and not bp.is_symlink():
                          log(f"Updated build.prop: {bp}")
                          pr = subprocess.Popen(
                              ["sudo", "tee", "-a", str(bp)],
                              stdin=subprocess.PIPE,
                              stdout=subprocess.DEVNULL,
                          )
                          pr.communicate(LOWRAM_PROPS.encode("utf-8"))
                          xr = subprocess.run(
                              ["sudo", "getfattr", "-d", "-m", "^security\\.", str(bp)],
                              capture_output=True, text=True, check=False,
                          )
                          log(f"SELinux xattr check: {xr.stdout.strip()}")

          for name in ("system", "product", "system_ext"):
              p_img = pdir / f"{name}.img"
              with p_img.open("rb") as f:
                  hdr = f.read(2048)
              is_erofs = hdr[1024:1028] == b"\xe2\xe1\xf5\xe0"
              is_ext4 = hdr[1080:1082] == b"\x53\xef"
              log(f"Check {name}: erofs={is_erofs} ext4={is_ext4}")

              u_res = subprocess.run(
                  ["sudo", "blkid", "-s", "UUID", "-o", "value", str(p_img)],
                  capture_output=True, text=True,
              )
              fs_uuid = u_res.stdout.strip()
              l_res = subprocess.run(
                  ["sudo", "blkid", "-s", "LABEL", "-o", "value", str(p_img)],
                  capture_output=True, text=True,
              )
              fs_label = l_res.stdout.strip()

              if is_erofs:
                  m_ro = Path("/tmp/m_ro")
                  m_rw = Path("/tmp/m_rw")
                  m_ro.mkdir(exist_ok=True)
                  m_rw.mkdir(exist_ok=True)
                  scr = Path("/tmp/scratch_ext4.img")
                  run(["rm", "-f", str(scr)], check=False)
                  run(["truncate", "-s", "1400M", str(scr)])
                  run(["mkfs.ext4", "-F", "-q", str(scr)])
                  run(["sudo", "mount", "-t", "erofs", "-o", "loop,ro", str(p_img), str(m_ro)])
                  run(["sudo", "mount", "-o", "loop,rw", str(scr), str(m_rw)])
                  run(["sudo", "rm", "-rf", str(m_rw / "lost+found")])
                  run(["sudo", "cp", "-a", f"{m_ro}/.", f"{m_rw}/"])
                  optimize_dir(m_rw)
                  out_img = pdir / f"{name}.new.img"
                  cmd = ["sudo", "mkfs.erofs", "-b", "4096"]
                  if fs_uuid:
                      cmd += ["-U", fs_uuid]
                  if fs_label:
                      cmd += ["-L", fs_label]
                  cmd += [str(out_img), str(m_rw)]
                  run(cmd)
                  run(["sudo", "umount", str(m_ro)])
                  run(["sudo", "umount", str(m_rw)])
                  run(["rm", "-f", str(scr)], check=False)
                  run(["sudo", "chown", f"{os.getuid()}:{os.getgid()}", str(out_img)])
                  out_img.replace(p_img)
              elif is_ext4:
                  run(["truncate", "-s", "+250M", str(p_img)])
                  run(["sudo", "e2fsck", "-f", "-y", str(p_img)], check=False)
                  run(["sudo", "resize2fs", "-f", str(p_img)])
                  run(["sudo", "e2fsck", "-E", "unshare_blocks", "-f", "-y", str(p_img)], check=False)
                  run(["sudo", "tune2fs", "-O", "^read-only", "-m", "0", str(p_img)])
                  run(["sudo", "resize2fs", "-f", str(p_img)])
                  m_rw = Path("/tmp/m_ext4")
                  m_rw.mkdir(exist_ok=True)
                  run(["sudo", "mount", "-o", "loop,rw", str(p_img), str(m_rw)])
                  optimize_dir(m_rw)
                  run(["sudo", "umount", str(m_rw)])
                  run(["sudo", "e2fsck", "-f", "-y", str(p_img)], check=False)
                  run(["sudo", "resize2fs", "-f", "-M", str(p_img)])
                  run(["sudo", "e2fsck", "-f", "-y", str(p_img)], check=False)
                  run(["sudo", "tune2fs", "-O", "read-only", str(p_img)])

              sz = p_img.stat().st_size
              aln = ((sz + 4095) // 4096) * 4096
              if aln != sz:
                  run(["truncate", "-s", str(aln), str(p_img)])
              log(f"Final {name} size: {p_img.stat().st_size} bytes")

          offset = 20480
          for p in parts:
              p_img = pdir / (p["name"] + ".img")
              sz = p_img.stat().st_size
              p["start_bytes"] = offset
              p["size_bytes"] = sz
              p["image_bytes"] = sz
              p["sha256"] = sha256_f(p_img)
              offset += sz

          total_bytes = offset + 20480
          new_disk = pdir / "rebuilt_system.img"
          run(["rm", "-f", str(new_disk)], check=False)
          run(["truncate", "-s", str(total_bytes), str(new_disk)])
          run(["sgdisk", "--clear", str(new_disk)])
          run(["sgdisk", f"--disk-guid={sd['disk_guid']}", str(new_disk)])

          for i, p in enumerate(parts, 1):
              s_sec = p["start_bytes"] // 512
              e_sec = (p["start_bytes"] + p["size_bytes"]) // 512 - 1
              run([
                  "sgdisk",
                  "--set-alignment=8",
                  f"--new={i}:{s_sec}:{e_sec}",
                  f"--typecode={i}:{p['type_guid']}",
                  f"--partition-guid={i}:{p['unique_guid']}",
                  f"--change-name={i}:{p['name']}",
                  str(new_disk),
              ])

          with new_disk.open("r+b") as df:
              for p in parts:
                  p_img = pdir / (p["name"] + ".img")
                  df.seek(p["start_bytes"])
                  with p_img.open("rb") as pf:
                      for b in iter(lambda: pf.read(4194304), b""):
                          df.write(b)

          run(["sgdisk", "--verify", str(new_disk)])
          new_disk.replace(disk_p)

          sd["size_bytes"] = disk_p.stat().st_size
          sd["sha256"] = sha256_f(disk_p)
          layout_p.write_text(json.dumps(layout, indent=2) + "\n", encoding="utf-8")

          for item in manifest["inventory"]:
              rel = item.get("path")
              if rel in ("boot/kernel-command-line.txt", "guest/partition-layout.json", "guest/system.img"):
                  item["size"] = (bsys / rel).stat().st_size

          manifest_p.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          log(f"SUCCESS! New GPT system.img size={sd['size_bytes']} sha256={sd['sha256']}")
          Path("report/mod-summary.txt").write_text("\n".join(logs) + "\n", encoding="utf-8")
          Path("report/partition-layout.new.json").write_text(layout_p.read_text(), encoding="utf-8")
          Path("report/release-manifest.new.json").write_text(manifest_p.read_text(), encoding="utf-8")

      - name: Step 3 - Repackage IPA
        run: |
          cd work
          zip -q -r -y ../CustomLowRAM-Andarium.ipa Payload

      - name: Step 4 - Upload Custom IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomLowRAM-Andarium-IPA
          path: CustomLowRAM-Andarium.ipa

      - name: Step 5 - Upload Mod Summary
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Summary-Report
          path: report/
