name: Build Custom UI & Clean IPA

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'ลิงก์ตรงของไฟล์ APK (เว้นว่างได้)'
        required: false
        default: ''

jobs:
  build-custom-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ดาวน์โหลดและเตรียมไฟล์ IPA + System Image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs unzip zip wget curl jq

          mkdir -p work
          echo "Downloading latest Andarium release info..."
          RELEASE_JSON=$(curl -s https://api.github.com/repos/imxieyi/Kernarium/releases/latest)

          IPA_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            IPA_URL="https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          fi
          echo "Downloading IPA from: $IPA_URL"
          wget -q --show-progress -O Andarium.ipa "$IPA_URL"
          unzip -q Andarium.ipa -d work

          # เช็กว่าใน IPA มี system.img ไหม ถ้าไม่มีให้ดึงจากไฟล์ tar.gz ของ Release
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          if [ -z "$SYS_IMG" ]; then
            echo "system.img not bundled inside IPA, downloading lineage tar.gz..."
            TAR_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n 1)
            if [ -n "$TAR_URL" ] && [ "$TAR_URL" != "null" ]; then
              wget -q --show-progress -O sys.tar.gz "$TAR_URL"
              APP_DIR=$(find work/Payload -maxdepth 1 -name "*.app" | head -n 1)
              tar -xzf sys.tar.gz -C "$APP_DIR"
            fi
          fi

      - name: 2. ปลดล็อก system.img ลบขยะ และฝังหน้า UI
        run: |
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          if [ -z "$SYS_IMG" ]; then
            echo "Warning: No system.img found, creating fallback structure..."
            APP_DIR=$(find work/Payload -maxdepth 1 -name "*.app" | head -n 1)
            dd if=/dev/zero of="$APP_DIR/system.img" bs=1M count=512
            mkfs.ext4 -F "$APP_DIR/system.img"
            SYS_IMG="$APP_DIR/system.img"
          fi

          echo "Processing image at: $SYS_IMG"

          # ขยายขนาดไฟล์และปลดล็อก Read-Only (shared_blocks) ของ Android
          dd if=/dev/zero bs=1M count=1200 >> "$SYS_IMG"
          sudo e2fsck -f -y "$SYS_IMG" || true
          sudo resize2fs "$SYS_IMG" || true
          sudo e2fsck -E unshare_blocks -y "$SYS_IMG" || true
          sudo tune2fs -O ^read-only "$SYS_IMG" || true

          sudo mkdir -p /mnt/android
          sudo mount -o loop,rw "$SYS_IMG" /mnt/android

          # กำหนดโฟลเดอร์ root ของ system (รองรับทั้งแบบมี /system ซ้อนและไม่มี)
          if [ -d "/mnt/android/system/app" ]; then
            SYS_ROOT="/mnt/android/system"
          else
            SYS_ROOT="/mnt/android"
          fi
          sudo mkdir -p "$SYS_ROOT/app" "$SYS_ROOT/priv-app" "$SYS_ROOT/etc/init" "$SYS_ROOT/etc/custom_launcher"

          # [1] ลบแอปขยะทั้งหมด
          sudo rm -rf "$SYS_ROOT"/product/app/{Jelly,Browser2,Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LatinIME} || true
          sudo rm -rf "$SYS_ROOT"/app/{Jelly,Browser2,Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LiveWallpapersPicker,PhotoTable,BasicDreams,BookmarkProvider,BuiltInPrintService,EasterEgg,HTMLViewer,PrintSpooler,SimAppDialog,Stk,WallpaperBackup} || true
          sudo rm -rf "$SYS_ROOT"/priv-app/{ContactsProvider,CalendarProvider,BlockedNumberProvider,CallLogBackup,CellBroadcastLegacyApp,EmergencyInfo,LiveWallpapersPicker,MmsService,MusicFX,StatementService,Tag,Telecom,TelephonyProvider,TeleService,VpnDialogs,WallpaperCropper} || true

          # [2] ลบไฟล์เสียงและแอนิเมชันขยะ
          sudo rm -rf "$SYS_ROOT"/media/bootanimation.zip "$SYS_ROOT"/product/media/bootanimation.zip || true
          sudo rm -rf "$SYS_ROOT"/media/audio/{alarms,notifications,ringtones} "$SYS_ROOT"/product/media/audio/{alarms,notifications,ringtones} || true

          # [3] ปรับแต่ง build.prop
          sudo touch "$SYS_ROOT/build.prop"
          sudo bash -c "cat << 'EOF' >> $SYS_ROOT/build.prop

ro.config.low_ram=true
ro.config.max_starting_bg=1
ro.sys.fw.bg_apps_limit=2
debug.sf.nobootanimation=1
debug.sf.disable_backpressure=1
ro.surface_flinger.max_frame_buffer_acquired_buffers=3
config.disable_wallpaper=true
config.disable_bluetooth=true
config.disable_telecom=true
config.disable_location=true
persist.sys.ui.hw=1
EOF"

          # [4] สร้างหน้า UI เข้าเกม (สไตล์ Rockstar Launcher)
          cat << 'EOF' > /tmp/index.html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at 75% 25%, #5a3825 0%, #141419 70%); color: #fff; display: flex; }
  .sidebar { width: 68px; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid rgba(255,255,255,0.08); }
  .logo-box { width: 40px; height: 40px; background: #ff9500; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 18px; margin-bottom: 24px; }
  .game-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 8px; border-left: 4px solid #ff9500; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 44px 70px 44px; position: relative; }
  .topnav { display: flex; justify-content: flex-end; align-items: center; gap: 32px; font-size: 16px; font-weight: 600; }
  .tab { color: rgba(255,255,255,0.6); cursor: pointer; }
  .tab.active { color: #fff; font-weight: 800; border-bottom: 2px solid #ff9500; padding-bottom: 4px; }
  .content-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-top: auto; }
  .left-col { display: flex; flex-direction: column; gap: 20px; }
  .game-title { font-size: 62px; font-weight: 900; text-shadow: 0 4px 12px rgba(0,0,0,0.8); line-height: 1; }
  .game-sub { font-size: 24px; font-weight: 800; color: #ff3b30; letter-spacing: 4px; }
  .play-btn { width: 280px; height: 58px; background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%); color: #000; border: none; border-radius: 6px; border-bottom: 4px solid #ff9500; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .cards { display: flex; gap: 18px; }
  .card { width: 230px; height: 270px; border-radius: 6px; background: linear-gradient(180deg, rgba(255,149,0,0.25) 0%, rgba(0,0,0,0.92) 100%); border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; justify-content: flex-end; position: relative; cursor: pointer; overflow: hidden; }
  .card.selected { border: 3px solid #ff9500; box-shadow: 0 0 20px rgba(255,149,0,0.4); }
  .badge { position: absolute; top: 10px; right: 10px; background: #fff; color: #000; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 4px; }
  .fps-num { font-size: 64px; font-weight: 900; padding: 0 16px; line-height: 1; }
  .fps-num span { font-size: 20px; margin-left: 4px; }
  .card-desc { background: rgba(0,0,0,0.88); padding: 12px 14px; font-size: 13px; font-weight: 700; margin-top: 8px; }
  .status-pill { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.92); color: #000; padding: 8px 20px; border-radius: 24px; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-box">F²</div>
    <div class="game-icon">GB27</div>
  </div>
  <div class="main">
    <div class="status-pill" id="statusText">🎮 โหมดเกม: เปิด (พร้อมรัน 60 FPS)</div>
    <div class="topnav">
      <div class="tab active">เกม</div>
      <div class="tab">ม็อด</div>
      <div class="tab">ข้อมูล</div>
      <div class="tab">การตั้งค่า</div>
    </div>
    <div class="content-row">
      <div class="left-col">
        <div>
          <div class="game-title">GOREBOX</div>
          <div class="game-sub">ANIMOSITY 27</div>
        </div>
        <button class="play-btn" onclick="launchGame()">▶ เล่น</button>
      </div>
      <div class="cards">
        <div class="card" onclick="selectPreset(0)">
          <div class="fps-num">30<span>FPS</span></div>
          <div class="card-desc">ประหยัดแบตเตอรี่: เครื่องเย็น</div>
        </div>
        <div class="card" onclick="selectPreset(1)">
          <div class="badge">แนะนำ</div>
          <div class="fps-num">30<span>FPS</span></div>
          <div class="card-desc">สมดุล: พื้นผิวสูงและเงาสูง</div>
        </div>
        <div class="card selected" onclick="selectPreset(2)">
          <div class="badge">ลื่นสุด</div>
          <div class="fps-num">60<span>FPS</span></div>
          <div class="card-desc">ประสิทธิภาพสูงสุด: เน้น FPS</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function selectPreset(idx) {
      document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('selected', i === idx));
      const labels = ['30 FPS ประหยัดแบต', '30 FPS สมดุล', '60 FPS ประสิทธิภาพสูงสุด'];
      document.getElementById('statusText').innerText = '🎮 โหมดที่เลือก: ' + labels[idx];
    }
    function launchGame() {
      document.getElementById('statusText').innerText = '⚡ กำลังเปิดเข้าเกม...';
      window.location.href = 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.F2Games.GBDE;end';
    }
  </script>
</body>
</html>
EOF
          sudo cp /tmp/index.html "$SYS_ROOT/etc/custom_launcher/index.html"

          cat << 'EOF' > /tmp/autostart_ui.rc
on property:sys.boot_completed=1
    exec - root root -- /system/bin/sh -c "wm density 140 && settings put global window_animation_scale 0 && settings put global transition_animation_scale 0 && settings put global animator_duration_scale 0 && am start -a android.intent.action.VIEW -d file:///system/etc/custom_launcher/index.html"
EOF
          sudo cp /tmp/autostart_ui.rc "$SYS_ROOT/etc/init/autostart_ui.rc"
          sudo chmod 644 "$SYS_ROOT/etc/init/autostart_ui.rc"

          # [5] ฝังไฟล์ APK ถ้ามีการใส่ลิงก์
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -q -O Game.apk "${{ github.event.inputs.apk_url }}" || true
            if [ -f "Game.apk" ]; then
              sudo mkdir -p "$SYS_ROOT/priv-app/MainGame/lib/arm64"
              sudo cp Game.apk "$SYS_ROOT/priv-app/MainGame/MainGame.apk"
              mkdir -p tmp_apk && unzip -q Game.apk "lib/arm64-v8a/*" -d tmp_apk || true
              if [ -d "tmp_apk/lib/arm64-v8a" ]; then
                sudo cp tmp_apk/lib/arm64-v8a/*.so "$SYS_ROOT/priv-app/MainGame/lib/arm64/" || true
              fi
              sudo chmod -R 755 "$SYS_ROOT/priv-app/MainGame"
            fi
          fi

          sync
          sudo umount /mnt/android
          sudo e2fsck -f -y "$SYS_IMG" || true

      - name: 3. แพ็กเป็นไฟล์ IPA
        run: |
          cd work
          zip -q -r ../CustomUI-Game.ipa Payload

      - name: 4. อัปโหลดไฟล์ IPA ให้ดาวน์โหลดลง iPad
        uses: actions/upload-artifact@v4
        with:
          name: CustomUI-Game-IPA
          path: CustomUI-Game.ipa
