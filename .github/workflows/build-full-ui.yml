name: Build Custom UI & Clean IPA

on:
  push:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK URL (Optional)'
        required: false
        default: ''

jobs:
  build-custom-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Official IPA
        run: |
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs android-sdk-libsparse-utils kpartx fdisk unzip zip wget curl jq

          mkdir -p work
          REL_JSON=$(curl -s https://api.github.com/repos/imxieyi/Kernarium/releases)
          IPA_URL=$(echo "$REL_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            IPA_URL="https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          fi
          wget -q -O Andarium.ipa "$IPA_URL" || curl -L -o Andarium.ipa "$IPA_URL"
          unzip -q Andarium.ipa -d work

      - name: Step 2 - In-Place Partition Debloat & UI Injection (Zero Size/Header Change)
        run: |
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          ORIG_SIZE=$(stat -c%s "$SYS_IMG")
          echo "=== Inspecting $SYS_IMG (Exact Size: $ORIG_SIZE bytes) ==="
          file "$SYS_IMG" || true
          fdisk -l "$SYS_IMG" || true

          # สร้างไฟล์ HTML หน้า UI และสคริปต์ Autostart เตรียมไว้ที่ /tmp
          UI_B64=""
          echo "$UI_B64" | base64 -d > /tmp/index.html
          printf "on property:sys.boot_completed=1\n    exec - root root -- /system/bin/sh -c \"settings put global window_animation_scale 0 && settings put global transition_animation_scale 0 && settings put global animator_duration_scale 0 && am start -a android.intent.action.VIEW -d file:///system/etc/custom_launcher/index.html\"\n" > /tmp/autostart_ui.rc

          # เชื่อมต่อ Loop Device พร้อมสแกน Partition Table (-P)
          LOOP_DEV=$(sudo losetup --find --show -P "$SYS_IMG")
          echo "Attached loop device: $LOOP_DEV"
          ls -la "${LOOP_DEV}"* || true

          # หาพาร์ทิชัน EXT4 ข้างในดิสก์ (ถ้ามีพาร์ทิชันย่อย p1, p2... หรือตัวดิสก์เอง)
          for PART in "${LOOP_DEV}"p* "$LOOP_DEV"; do
            if [ -e "$PART" ]; then
              FST=$(sudo blkid -s TYPE -o value "$PART" 2>/dev/null || true)
              echo "Checking $PART -> TYPE=$FST"
              if [ "$FST" = "ext4" ] || [ "$FST" = "ext2" ]; then
                echo "Found EXT4 partition at $PART! Unlocking and mounting in-place..."
                sudo e2fsck -f -y "$PART" || true
                sudo e2fsck -E unshare_blocks -f -y "$PART" || true
                sudo tune2fs -O ^read-only "$PART" || true

                sudo mkdir -p /mnt/part
                if sudo mount -o rw "$PART" /mnt/part 2>/dev/null; then
                  echo "Successfully mounted $PART in-place RW!"
                  if [ -d "/mnt/part/system/app" ]; then
                    SR="/mnt/part/system"
                  elif [ -d "/mnt/part/app" ]; then
                    SR="/mnt/part"
                  else
                    SR=""
                  fi

                  if [ -n "$SR" ]; then
                    echo "Debloating Android system at $SR..."
                    sudo rm -rf "$SR"/product/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email} || true
                    sudo rm -rf "$SR"/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LiveWallpapersPicker,PhotoTable,BasicDreams,EasterEgg} || true
                    sudo rm -rf "$SR"/media/bootanimation.zip "$SR"/product/media/bootanimation.zip || true
                    sudo rm -rf "$SR"/media/audio/{alarms,notifications,ringtones} "$SR"/product/media/audio/{alarms,notifications,ringtones} || true
                    sudo rm -f "$SR"/fonts/NotoSansCJK* "$SR"/fonts/NotoSerifCJK* || true

                    if [ -f "$SR/build.prop" ]; then
                      sudo cp -a "$SR/build.prop" /tmp/bp.bak
                      printf "\ndebug.sf.nobootanimation=1\nro.surface_flinger.max_frame_buffer_acquired_buffers=3\n" | sudo tee -a "$SR/build.prop" > /dev/null
                      sudo chcon --reference=/tmp/bp.bak "$SR/build.prop" 2>/dev/null || true
                    fi

                    sudo mkdir -p "$SR/etc/custom_launcher" "$SR/etc/init"
                    sudo cp /tmp/index.html "$SR/etc/custom_launcher/index.html"
                    sudo cp /tmp/autostart_ui.rc "$SR/etc/init/autostart_ui.rc"
                    sudo chmod 755 "$SR/etc/custom_launcher"
                    sudo chmod 644 "$SR/etc/custom_launcher/index.html" "$SR/etc/init/autostart_ui.rc"
                    sudo chcon -R --reference="$SR/etc" "$SR/etc/custom_launcher" 2>/dev/null || true
                    sudo chcon --reference="$SR/etc/init" "$SR/etc/init/autostart_ui.rc" 2>/dev/null || true
                  fi

                  sync
                  sudo umount /mnt/part
                fi
                sudo e2fsck -f -y "$PART" || true
              fi
            fi
          done

          sudo losetup -d "$LOOP_DEV" || true

          # ตรวจสอบว่าขนาดไฟล์เท่ากับ 1048506368 bytes เท่าเดิมเป๊ะทุกไบต์!
          truncate -s "$ORIG_SIZE" "$SYS_IMG"
          FINAL_SIZE=$(stat -c%s "$SYS_IMG")
          echo "Verified exact byte size: $FINAL_SIZE (Original: $ORIG_SIZE)"

      - name: Step 3 - Repackage IPA (Preserve Symlinks)
        run: |
          cd work
          zip -q -r -y ../CustomUI-Game.ipa Payload

      - name: Step 4 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomUI-Game-IPA
          path: CustomUI-Game.ipa
