name: Build Custom UI & Clean IPA

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'วางลิงก์ดาวน์โหลดตรงของไฟล์ APK เกม (หรือเว้นว่างไว้เพื่อไปกด Install APK ทีหลัง)'
        required: false
        default: ''

jobs:
  build-custom-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ดาวน์โหลดไฟล์ Andarium.ipa ต้นฉบับ
        run: |
          wget -q --show-progress -O Andarium.ipa "https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          mkdir -p work && unzip -q Andarium.ipa -d work

      - name: 2. เปิดก้อน system.img เพื่อลบแอปและไฟล์ขยะทั้งหมด
        run: |
          SYS_IMG=$(find work/Payload/Andarium.app -name "system.img" | head -n 1)
          
          # ขยายขนาดพาร์ทิชันรองรับตัวเกม
          dd if=/dev/zero bs=1M count=1500 >> "$SYS_IMG"
          e2fsck -f -y "$SYS_IMG" || true
          resize2fs "$SYS_IMG"
          
          sudo mkdir -p /mnt/android
          sudo mount -o loop,rw "$SYS_IMG" /mnt/android
          
          # [ส่วนที่ 1] ลบแอปติดเครื่องที่ไม่จำเป็นออกทั้งหมด
          sudo rm -rf /mnt/android/system/product/app/{Jelly,Browser2,Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LatinIME}
          sudo rm -rf /mnt/android/system/app/{Jelly,Browser2,Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LiveWallpapersPicker,PhotoTable,BasicDreams,BookmarkProvider,BuiltInPrintService,CompanionDeviceManager,EasterEgg,HTMLViewer,KeyChain,PacProcessor,PrintRecommendationService,PrintSpooler,SimAppDialog,Stk,UserDictionaryProvider,WallpaperBackup}
          sudo rm -rf /mnt/android/system/priv-app/{ContactsProvider,CalendarProvider,DownloadProviderUi,BlockedNumberProvider,CallLogBackup,CellBroadcastLegacyApp,EmergencyInfo,LiveWallpapersPicker,ManagedProvisioning,MmsService,MusicFX,StatementService,Tag,Telecom,TelephonyProvider,TeleService,VpnDialogs,WallpaperCropper}
          
          # [ส่วนที่ 2] ลบไฟล์ขยะในระบบ (ไฟล์เสียงริงโทน, แอนิเมชันบูต, ฟอนต์ส่วนเกิน)
          sudo rm -rf /mnt/android/system/media/bootanimation.zip
          sudo rm -rf /mnt/android/system/product/media/bootanimation.zip
          sudo rm -rf /mnt/android/system/media/audio/{alarms,notifications,ringtones}
          sudo rm -rf /mnt/android/system/product/media/audio/{alarms,notifications,ringtones}
          
          # แก้ไขไฟล์ build.prop เพื่อปิดบริการพื้นหลังและรีดความลื่นสูงสุด
          sudo bash -c 'cat << EOF >> /mnt/android/system/build.prop
          ro.config.low_ram=true
          ro.config.max_starting_bg=1
          ro.sys.fw.bg_apps_limit=2
          debug.sf.nobootanimation=1
          debug.sf.disable_backpressure=1
          ro.surface_flinger.max_frame_buffer_acquired_buffers=3
          config.disable_wallpaper=true
          config.disable_bluetooth=true
          config.disable_telecom=true
          config.disable_location=true
          persist.sys.ui.hw=1
          EOF'

      - name: 3. สร้างหน้า UI เข้าเกม (สไตล์ Rockstar Launcher) และสคริปต์สลับโหมด 30/60 FPS
        run: |
          # สร้างหน้า UI HTML5/CSS แบบเต็มจอที่จำลองดีไซน์จากรูปภาพของคุณเป๊ะๆ
          sudo mkdir -p /mnt/android/system/etc/custom_launcher
          sudo bash -c 'cat << "EOF" > /mnt/android/system/etc/custom_launcher/index.html
          <!DOCTYPE html>
          <html lang="th">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Game Launcher</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            body { width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at 75% 25%, #5a3825 0%, #141419 70%); color: #fff; display: flex; }
            .sidebar { width: 68px; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid rgba(255,255,255,0.08); }
            .logo-box { width: 40px; height: 40px; background: #ff9500; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 18px; margin-bottom: 24px; }
            .game-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 8px; border-left: 4px solid #ff9500; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
            .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 44px 70px 44px; position: relative; }
            .topnav { display: flex; justify-content: flex-end; align-items: center; gap: 32px; font-size: 16px; font-weight: 600; }
            .tab { color: rgba(255,255,255,0.6); cursor: pointer; transition: 0.2s; }
            .tab.active { color: #fff; font-weight: 800; border-bottom: 2px solid #ff9500; padding-bottom: 4px; }
            .content-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-top: auto; }
            .left-col { display: flex; flex-direction: column; gap: 20px; }
            .game-title { font-size: 62px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 12px rgba(0,0,0,0.8); line-height: 1; }
            .game-sub { font-size: 24px; font-weight: 800; color: #ff3b30; letter-spacing: 4px; }
            .play-btn { width: 280px; height: 58px; background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%); color: #000; border: none; border-radius: 6px; border-bottom: 4px solid #ff9500; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
            .play-btn:active { transform: scale(0.98); }
            .cards { display: flex; gap: 18px; }
            .card { width: 230px; height: 270px; border-radius: 6px; background: linear-gradient(180deg, rgba(255,149,0,0.25) 0%, rgba(0,0,0,0.92) 100%); border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; justify-content: flex-end; position: relative; cursor: pointer; overflow: hidden; }
            .card.selected { border: 3px solid #ff9500; box-shadow: 0 0 20px rgba(255,149,0,0.4); }
            .badge { position: absolute; top: 10px; right: 10px; background: #fff; color: #000; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 4px; }
            .fps-num { font-size: 64px; font-weight: 900; padding: 0 16px; line-height: 1; }
            .fps-num span { font-size: 20px; margin-left: 4px; }
            .card-desc { background: rgba(0,0,0,0.88); padding: 12px 14px; font-size: 13px; font-weight: 700; margin-top: 8px; }
            .status-pill { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.92); color: #000; padding: 8px 20px; border-radius: 24px; font-weight: 700; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
          </style>
          </head>
          <body>
            <div class="sidebar">
              <div class="logo-box">F²</div>
              <div class="game-icon">GB27</div>
            </div>
            <div class="main">
              <div class="status-pill" id="statusText">🎮 โหมดเกม: เปิด (พร้อมรัน 60 FPS)</div>
              <div class="topnav">
                <div class="tab active">เกม</div>
                <div class="tab">ม็อด</div>
                <div class="tab">ข้อมูล</div>
                <div class="tab">การตั้งค่า</div>
              </div>
              <div class="content-row">
                <div class="left-col">
                  <div>
                    <div class="game-title">GOREBOX</div>
                    <div class="game-sub">ANIMOSITY 27</div>
                  </div>
                  <button class="play-btn" onclick="launchGame()">▶ เล่น</button>
                </div>
                <div class="cards">
                  <div class="card" id="card0" onclick="selectPreset(0, 120)">
                    <div class="fps-num">30<span>FPS</span></div>
                    <div class="card-desc">ประหยัดแบตเตอรี่: เครื่องเย็น</div>
                  </div>
                  <div class="card" id="card1" onclick="selectPreset(1, 160)">
                    <div class="badge">แนะนำ</div>
                    <div class="fps-num">30<span>FPS</span></div>
                    <div class="card-desc">สมดุล: พื้นผิวสูงและเงาสูง</div>
                  </div>
                  <div class="card selected" id="card2" onclick="selectPreset(2, 140)">
                    <div class="badge">ลื่นสุด</div>
                    <div class="fps-num">60<span>FPS</span></div>
                    <div class="card-desc">ประสิทธิภาพสูงสุด: เน้น FPS</div>
                  </div>
                </div>
              </div>
            </div>
            <script>
              let currentDensity = 140;
              function selectPreset(idx, density) {
                currentDensity = density;
                document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('selected', i === idx));
                const labels = ['30 FPS ประหยัดแบต', '30 FPS สมดุล', '60 FPS ประสิทธิภาพสูงสุด'];
                document.getElementById('statusText').innerText = '🎮 โหมดที่เลือก: ' + labels[idx];
              }
              function launchGame() {
                document.getElementById('statusText').innerText = '⚡ กำลังเร่งประสิทธิภาพและเปิดเข้าเกม...';
                window.location.href = 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.F2Games.GBDE;component=com.F2Games.GBDE/com.unity3d.player.UnityPlayerActivity;end';
              }
            </script>
          </body>
          </html>
          EOF'

          # ตั้งค่าสคริปต์ตอนบูตให้ปรับความละเอียดหน้าจอและเปิดหน้า UI Launcher นี้ขึ้นมาทันทีที่บูตเสร็จ
          sudo bash -c 'cat << "EOF" > /mnt/android/system/etc/init/autostart_ui.rc
          on property:sys.boot_completed=1
              exec - root root -- /system/bin/sh -c "wm density 140 && settings put global window_animation_scale 0 && settings put global transition_animation_scale 0 && settings put global animator_duration_scale 0 && am start -a android.intent.action.VIEW -d file:///system/etc/custom_launcher/index.html"
          EOF'
          sudo chmod 644 /mnt/android/system/etc/init/autostart_ui.rc

      - name: 4. ฝังตัวเกมและแพ็กกลับเป็นไฟล์ IPA
        run: |
          SYS_IMG=$(find work/Payload/Andarium.app -name "system.img" | head -n 1)
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -O Game.apk "${{ github.event.inputs.apk_url }}"
            sudo mkdir -p /mnt/android/system/priv-app/MainGame/lib/arm64
            sudo cp Game.apk /mnt/android/system/priv-app/MainGame/MainGame.apk
            mkdir -p tmp_apk && unzip -q Game.apk "lib/arm64-v8a/*" -d tmp_apk || true
            if [ -d "tmp_apk/lib/arm64-v8a" ]; then
              sudo cp tmp_apk/lib/arm64-v8a/*.so /mnt/android/system/priv-app/MainGame/lib/arm64/
            fi
            sudo chmod -R 755 /mnt/android/system/priv-app/MainGame
          fi
          
          sync
          sudo umount /mnt/android
          e2fsck -f -y "$SYS_IMG" || true
          
          cd work
          zip -q -r ../CustomUI-Game.ipa Payload

      - name: 5. อัปโหลดไฟล์ IPA ให้ดาวน์โหลดลง iPad
        uses: actions/upload-artifact@v4
        with:
          name: CustomUI-Game-IPA
          path: CustomUI-Game.ipa
