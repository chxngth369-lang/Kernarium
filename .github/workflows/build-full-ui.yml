name: Inspect Boot Command and Disk Builder

on:
  push:
  workflow_dispatch:

jobs:
  inspect-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Upstream Source
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Collect Boot and Disk Config Files
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y erofs-utils gdisk unzip curl jq

          mkdir -p work report
          API="https://api.github.com/repos/imxieyi/Kernarium/releases"
          Q='[.[] | .assets[]? | select(.name | endswith(".ipa")) | .browser_download_url][0]'
          IPA_URL=$(curl -sL "$API" | jq -r "$Q")
          curl -fL -o Andarium.ipa "$IPA_URL"
          unzip -q -o Andarium.ipa -d work

          cp work/Payload/Andarium.app/andarium-system/boot/kernel-command-line.txt report/ 2>/dev/null || true
          sgdisk -p work/Payload/Andarium.app/andarium-system/guest/system.img > report/orig-gpt.txt 2>&1 || true

          cp upstream/android/lineage-24/tools/ubd-disk.py report/ 2>/dev/null || true
          cp upstream/android/lineage-24/support/image/disk-policy.json report/ 2>/dev/null || true
          cp upstream/android/lineage-24/tools/publish-release.py report/ 2>/dev/null || true
          exit 0

      - name: Step 3 - Find Runtime Validation Rules
        shell: python3 {0}
        run: |
          from pathlib import Path
          import subprocess

          disk = Path("work/Payload/Andarium.app/andarium-system/guest/system.img")
          p_sys = Path("/tmp/orig_sys.img")
          with disk.open("rb") as f:
              f.seek(20209664)
              p_sys.write_bytes(f.read(4096 * 64))
          r = subprocess.run(["dump.erofs", "-s", str(p_sys)], capture_output=True, text=True)
          Path("report/erofs-header.txt").write_text(r.stdout + "\n" + r.stderr, encoding="utf-8")

          hits = []
          keywords = ("runtime result", "partition-layout", "kernel-command-line", "system_disk")
          for p in Path("upstream").rglob("*"):
              if p.is_file() and p.suffix in (".swift", ".c", ".h", ".py", ".mm"):
                  txt = p.read_text(encoding="utf-8", errors="ignore")
                  for kw in keywords:
                      if kw in txt:
                          hits.append(f"=== {p} ({kw}) ===")
                          for idx, line in enumerate(txt.splitlines(), 1):
                              if kw in line:
                                  hits.append(f"L{idx}: {line[:160]}")
                          break
          Path("report/runtime-checks.txt").write_text("\n".join(hits) + "\n", encoding="utf-8")

      - name: Step 4 - Upload Boot Report
        uses: actions/upload-artifact@v4
        with:
          name: Boot-Config-Report
          path: report/
