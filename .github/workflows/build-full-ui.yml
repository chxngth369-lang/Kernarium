name: Get HomeView and Xcode Build Info

on:
  push:
  workflow_dispatch:

jobs:
  get-homeview-info:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Kernarium Repository
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Collect HomeView, GuestHost, and Xcode Project Files
        shell: python3 {0}
        run: |
          from pathlib import Path

          root = Path("upstream")
          out = Path("homeview_info")
          out.mkdir(exist_ok=True)

          # 1. List all files under Andarium/, scripts/, darwin/, CMake*
          tree_lines = []
          for p in sorted(root.rglob("*")):
              if p.is_file() and ".git/" not in str(p):
                  rel = str(p.relative_to(root))
                  if rel.startswith(("Andarium/", "scripts/", "darwin/", "CMake", ".github/")):
                      tree_lines.append(f"{p.stat().st_size:10d}  {rel}")
          (out / "1-project-tree.txt").write_text("\n".join(tree_lines) + "\n", encoding="utf-8")

          # 2. Dump all Swift/ObjC/C/plist/pbxproj files under Andarium/ (excluding Tests & Preview)
          ui_chunks = []
          andarium_dir = root / "Andarium"
          if andarium_dir.exists():
              for p in sorted(andarium_dir.rglob("*")):
                  if not p.is_file():
                      continue
                  rel = str(p.relative_to(root))
                  if "Tests/" in rel or "/Preview/" in rel or rel.endswith(".png"):
                      continue
                  if p.stat().st_size <= 200000:
                      txt = p.read_text(encoding="utf-8", errors="replace")
                      ui_chunks.append(f"=== FILE: {rel} ===\n{txt}\n")
          (out / "2-andarium-ui-and-project.txt").write_text("\n".join(ui_chunks), encoding="utf-8")

          # 3. Dump packaging/build scripts and CMakePresets
          build_chunks = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or ".git/" not in str(p) and False:
                  continue
              rel = str(p.relative_to(root))
              if (
                  rel in ("CMakeLists.txt", "CMakePresets.json", "darwin/CMakeLists.txt")
                  or (rel.startswith("scripts/") and p.stat().st_size <= 80000)
                  or (rel.startswith("darwin/runtime_loader") and p.stat().st_size <= 80000)
                  or (rel.startswith(".github/workflows/") and p.stat().st_size <= 80000)
              ):
                  txt = p.read_text(encoding="utf-8", errors="replace")
                  build_chunks.append(f"=== FILE: {rel} ===\n{txt}\n")
          (out / "3-build-and-cmake.txt").write_text("\n".join(build_chunks), encoding="utf-8")
          print("Collected all HomeView & Xcode build files successfully!", flush=True)

      - name: Step 3 - Upload HomeView Build Info
        uses: actions/upload-artifact@v4
        with:
          name: HomeView-Build-Info
          path: homeview_info/
