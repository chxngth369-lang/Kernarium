name: Build GB27 Minimal Game OS IPAs

on:
  push:
  workflow_dispatch:

jobs:
  build-gb27-minimal-os:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Upstream Tools
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Install Packages and Unpack Official IPA
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs erofs-utils attr util-linux unzip zip wget curl jq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libzstd-dev liblz4-dev uuid-dev
          sudo modprobe erofs || true

          mkdir -p work
          API="https://api.github.com/repos/imxieyi/Kernarium/releases"
          Q='[.[] | .assets[]? | select(.name | endswith(".ipa")) | .browser_download_url][0]'
          IPA_URL=$(curl -sL "$API" | jq -r "$Q")
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            HTML=$(curl -sL "https://github.com/imxieyi/Kernarium/releases")
            REL=$(echo "$HTML" | grep -oE '/imxieyi/Kernarium/releases/download/[^"]+\.ipa' | head -n 1)
            if [ -n "$REL" ]; then
              IPA_URL="https://github.com$REL"
            else
              IPA_URL="https://github.com/imxieyi/Kernarium/releases/latest/download/Andarium.ipa"
            fi
          fi
          echo "Downloading IPA from: $IPA_URL"
          curl -fL --retry 3 -o Andarium.ipa "$IPA_URL" || wget -O Andarium.ipa "$IPA_URL"
          unzip -q -o Andarium.ipa -d work
          rm -f Andarium.ipa
          exit 0

      - name: Step 3 - Build Minimal GB27 Game-Only Android Editions
        shell: python3 {0}
        run: |
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          bsys = Path("work/Payload/Andarium.app/andarium-system")
          layout_p = bsys / "guest/partition-layout.json"
          manifest_p = bsys / "release-manifest.json"
          disk_p = bsys / "guest/system.img"

          def run(cmd, check=True):
              print("+", " ".join(str(x) for x in cmd), flush=True)
              return subprocess.run(cmd, check=check)

          if not disk_p.exists():
              raise SystemExit("ERROR: Andarium.ipa was not unpacked properly in Step 2")

          mkfs_erofs = "mkfs.erofs"
          probe_dir = Path("/tmp/erofs_probe")
          probe_dir.mkdir(exist_ok=True)
          (probe_dir / "t.txt").write_text("ok", encoding="utf-8")
          probe_img = Path("/tmp/probe.erofs")
          probe_img.unlink(missing_ok=True)
          pr_test = subprocess.run(
              [mkfs_erofs, "-zzstd", "-b", "4096", str(probe_img), str(probe_dir)],
              capture_output=True, text=True, check=False,
          )
          if pr_test.returncode != 0:
              src = Path("/tmp/erofs-src")
              shutil.rmtree(src, ignore_errors=True)
              r1 = subprocess.run([
                  "git", "clone", "--depth", "1",
                  "https://github.com/erofs/erofs-utils.git", str(src),
              ])
              if r1.returncode != 0:
                  run([
                      "git", "clone", "--depth", "1",
                      "https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git",
                      str(src),
                  ])
              subprocess.run(["./autogen.sh"], cwd=src, check=True)
              subprocess.run(["./configure", "--enable-lz4", "--with-libzstd"], cwd=src, check=True)
              subprocess.run(["make", "-j4"], cwd=src, check=True)
              mkfs_erofs = str((src / "mkfs/mkfs.erofs").resolve())

          zstd_flag = "-zzstd"
          for cand in ("-zzstd,15", "-zzstd,9"):
              probe_img.unlink(missing_ok=True)
              if subprocess.run(
                  [mkfs_erofs, cand, "-b", "4096", str(probe_img), str(probe_dir)],
                  capture_output=True, text=True, check=False,
              ).returncode == 0:
                  zstd_flag = cand
                  break

          layout = json.loads(layout_p.read_text(encoding="utf-8"))
          orig_manifest = json.loads(manifest_p.read_text(encoding="utf-8"))
          parts = layout["system_disk"]["partitions"]

          base_parts = Path("/tmp/base_parts")
          shutil.rmtree(base_parts, ignore_errors=True)
          base_parts.mkdir(parents=True, exist_ok=True)

          with disk_p.open("rb") as df:
              for p in parts:
                  out = base_parts / (p["name"] + ".img")
                  df.seek(p["start_bytes"])
                  rem = p["size_bytes"]
                  with out.open("wb") as wf:
                      while rem > 0:
                          c = df.read(min(4194304, rem))
                          if not c:
                              break
                          wf.write(c)
                          rem -= len(c)

          def is_real_file(path_obj):
              r1 = subprocess.run(["sudo", "test", "-f", str(path_obj)], check=False)
              r2 = subprocess.run(["sudo", "test", "!", "-L", str(path_obj)], check=False)
              return r1.returncode == 0 and r2.returncode == 0

          def edit_erofs_image(src_img: Path, dst_img: Path, edit_fn):
              u_res = subprocess.run(
                  ["sudo", "blkid", "-s", "UUID", "-o", "value", str(src_img)],
                  capture_output=True, text=True,
              )
              fs_uuid = u_res.stdout.strip()
              l_res = subprocess.run(
                  ["sudo", "blkid", "-s", "LABEL", "-o", "value", str(src_img)],
                  capture_output=True, text=True,
              )
              fs_label = l_res.stdout.strip()

              m_ro = Path("/tmp/m_ro")
              m_rw = Path("/tmp/m_rw")
              subprocess.run(["sudo", "umount", str(m_ro)], check=False)
              subprocess.run(["sudo", "umount", str(m_rw)], check=False)
              m_ro.mkdir(exist_ok=True)
              m_rw.mkdir(exist_ok=True)
              scr = Path("/tmp/scratch_ext4.img")
              run(["rm", "-f", str(scr)], check=False)
              run(["truncate", "-s", "2500M", str(scr)])
              run(["mkfs.ext4", "-F", "-q", str(scr)])
              run(["sudo", "mount", "-t", "erofs", "-o", "loop,ro", str(src_img), str(m_ro)])
              run(["sudo", "mount", "-o", "loop,rw", str(scr), str(m_rw)])
              run(["sudo", "rm", "-rf", str(m_rw / "lost+found")])
              run(["sudo", "cp", "-a", f"{m_ro}/.", f"{m_rw}/"])

              rx = subprocess.run(
                  ["sudo", "getfattr", "--only-values", "-n", "security.selinux", str(m_ro)],
                  capture_output=True, text=True, check=False,
              )
              if rx.returncode == 0 and rx.stdout.strip():
                  run(["sudo", "setfattr", "-n", "security.selinux", "-v", rx.stdout.strip(), str(m_rw)])

              edit_fn(m_rw)

              dst_img.unlink(missing_ok=True)
              cmd = ["sudo", mkfs_erofs, zstd_flag, "-b", "4096", "-T", "1230768000"]
              if fs_uuid:
                  cmd += ["-U", fs_uuid]
              if fs_label:
                  cmd += ["-L", fs_label]
              cmd += [str(dst_img), str(m_rw)]
              run(cmd)

              run(["sudo", "umount", str(m_ro)])
              run(["sudo", "umount", str(m_rw)])
              run(["rm", "-f", str(scr)], check=False)
              run(["sudo", "chown", f"{os.getuid()}:{os.getgid()}", str(dst_img)])

          def tune_minimal_product(root):
              # Keep ONLY Settings, Files, and Keyboard; remove all other user apps and media
              bloat_apps = (
                  "ExactCalculator",
                  "Calculator",
                  "Etar",
                  "Calendar",
                  "DeskClock",
                  "Glimpse",
                  "Gallery2",
                  "Aperture",
                  "Camera2",
                  "Recorder",
                  "Eleven",
                  "Twelve",
                  "Music",
                  "Contacts",
                  "Dialer",
                  "Messaging",
                  "Email",
                  "BasicDreams",
                  "PhotoTable",
                  "Jelly",
                  "Browser2",
              )
              for app in bloat_apps:
                  t = root / "app" / app
                  if subprocess.run(["sudo", "test", "-e", str(t)], check=False).returncode == 0:
                      run(["sudo", "rm", "-rf", str(t)])

              for media_sub in ("media/audio/ringtones", "media/audio/alarms"):
                  ms = root / media_sub
                  if subprocess.run(["sudo", "test", "-e", str(ms)], check=False).returncode == 0:
                      run(["sudo", "rm", "-rf", str(ms)])

              props = "\n".join([
                  "",
                  "# Dedicated Minimal GB27 Appliance Props",
                  "ro.product.locale=en-US",
                  "persist.sys.locale=en-US",
                  "persist.sys.sf.disable_blurs=1",
                  "ro.launcher.blur.appLaunch=0",
                  "ro.sys.fw.bg_apps_limit=4",
                  "persist.traced.enable=0",
                  "",
              ])
              bp = root / "etc/build.prop"
              if is_real_file(bp):
                  pr = subprocess.Popen(
                      ["sudo", "tee", "-a", str(bp)],
                      stdin=subprocess.PIPE,
                      stdout=subprocess.DEVNULL,
                  )
                  pr.communicate(props.encode("utf-8"))

          def make_vendor_editor(force_app_gles3: bool):
              def _edit(root):
                  # Disable broken virtual V4L2 video service & self-test
                  for rc_name in (
                      "android.hardware.media.c2-service-v4l2.rc",
                      "boringssl_self_test.rc",
                  ):
                      rc_p = root / "etc/init" / rc_name
                      if subprocess.run(["sudo", "test", "-e", str(rc_p)], check=False).returncode == 0:
                          run(["sudo", "rm", "-f", str(rc_p)])

                  if force_app_gles3:
                      # Restrict vulkan.virtio.so to UID 1000 (SurfaceFlinger) so Android 17 boots 100%
                      # while user apps (UID 10000+, like GB27) cleanly fall back to libGLESv2_kernarium.so!
                      vk_so = root / "lib64/hw/vulkan.virtio.so"
                      if subprocess.run(["sudo", "test", "-e", str(vk_so)], check=False).returncode == 0:
                          run(["sudo", "chown", "1000:1000", str(vk_so)])
                          run(["sudo", "chmod", "0600", str(vk_so)])
                      for xml_name in (
                          "android.hardware.vulkan.compute-0.xml",
                          "android.hardware.vulkan.level-1.xml",
                          "android.hardware.vulkan.version-1_4.xml",
                      ):
                          xp = root / "etc/permissions" / xml_name
                          if subprocess.run(["sudo", "test", "-e", str(xp)], check=False).returncode == 0:
                              run(["sudo", "rm", "-f", str(xp)])

                  vbp = root / "build.prop"
                  cat_res = subprocess.run(
                      ["sudo", "cat", str(vbp)],
                      capture_output=True, text=True, check=False,
                  )
                  if cat_res.returncode == 0 and is_real_file(vbp):
                      replacements = {
                          "ro.surface_flinger.supports_background_blur=1": "ro.surface_flinger.supports_background_blur=0",
                          "ro.vendor.v4l2_codec2.decoder.supported.h264=true": "ro.vendor.v4l2_codec2.decoder.supported.h264=false",
                          "ro.vendor.v4l2_codec2.decoder.supported.hevc=true": "ro.vendor.v4l2_codec2.decoder.supported.hevc=false",
                          "ro.vendor.v4l2_codec2.encoder.supported.h264=true": "ro.vendor.v4l2_codec2.encoder.supported.h264=false",
                          "ro.vendor.v4l2_codec2.encoder.supported.hevc=true": "ro.vendor.v4l2_codec2.encoder.supported.hevc=false",
                          "ro.vendor.fingerprint_virtual_hal_start=true": "ro.vendor.fingerprint_virtual_hal_start=false",
                          "ro.camerax.extensions.enabled=true": "ro.camerax.extensions.enabled=false",
                          "drm.service.enabled=true": "drm.service.enabled=false",
                          "bluetooth.profile.bap.unicast.client.enabled=true": "bluetooth.profile.bap.unicast.client.enabled=false",
                          "bluetooth.profile.bas.client.enabled=true": "bluetooth.profile.bas.client.enabled=false",
                          "bluetooth.profile.ccp.server.enabled=true": "bluetooth.profile.ccp.server.enabled=false",
                          "bluetooth.profile.csip.set_coordinator.enabled=true": "bluetooth.profile.csip.set_coordinator.enabled=false",
                          "bluetooth.profile.hap.client.enabled=true": "bluetooth.profile.hap.client.enabled=false",
                          "bluetooth.profile.mcp.server.enabled=true": "bluetooth.profile.mcp.server.enabled=false",
                          "bluetooth.profile.vcp.controller.enabled=true": "bluetooth.profile.vcp.controller.enabled=false",
                      }
                      new_lines = []
                      for line in cat_res.stdout.splitlines():
                          s = line.strip()
                          new_lines.append(replacements.get(s, line))
                      new_lines += [
                          "",
                          "# Dedicated GB27 Vendor Media & Graphics",
                          "ro.egl.blobcache.multifile=false",
                          "",
                      ]
                      patched_text = "\n".join(new_lines) + "\n"
                      pr = subprocess.Popen(
                          ["sudo", "tee", str(vbp)],
                          stdin=subprocess.PIPE,
                          stdout=subprocess.DEVNULL,
                      )
                      pr.communicate(patched_text.encode("utf-8"))
              return _edit

          # Build shared minimal product.img once
          edit_erofs_image(base_parts / "product.img", base_parts / "product.min.img", tune_minimal_product)
          (base_parts / "product.min.img").replace(base_parts / "product.img")

          ubd_tool = Path("upstream/android/lineage-24/tools/ubd-disk.py").resolve()
          policy_p = Path("upstream/android/lineage-24/support/image/disk-policy.json").resolve()

          def build_ipa_variant(variant_name: str, force_app_gles3: bool, out_ipa: Path):
              vdir = Path(f"/tmp/parts_{variant_name}")
              shutil.rmtree(vdir, ignore_errors=True)
              shutil.copytree(base_parts, vdir)

              edit_erofs_image(
                  vdir / "vendor.img",
                  vdir / "vendor.new.img",
                  make_vendor_editor(force_app_gles3),
              )
              (vdir / "vendor.new.img").replace(vdir / "vendor.img")

              assembled = Path(f"/tmp/assembled_{variant_name}")
              shutil.rmtree(assembled, ignore_errors=True)
              run([
                  "python3", str(ubd_tool), "assemble",
                  "--policy", str(policy_p),
                  "--images-dir", str(vdir.resolve()),
                  "--output-dir", str(assembled.resolve()),
              ])
              run([
                  "python3", str(ubd_tool), "verify",
                  "--layout", str((assembled / "partition-layout.json").resolve()),
                  "--disk", str((assembled / "system.img").resolve()),
                  "--hash",
                  "--policy", str(policy_p),
              ])

              shutil.copyfile(assembled / "system.img", disk_p)
              shutil.copyfile(assembled / "partition-layout.json", layout_p)

              manifest = json.loads(json.dumps(orig_manifest))
              for item in manifest["inventory"]:
                  rel = item.get("path")
                  if rel in ("boot/kernel-command-line.txt", "guest/partition-layout.json", "guest/system.img"):
                      item["size"] = (bsys / rel).stat().st_size
              manifest_p.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              out_ipa.unlink(missing_ok=True)
              subprocess.run(
                  ["zip", "-q", "-r", "-y", str(out_ipa.resolve()), "Payload"],
                  cwd="work",
                  check=True,
              )
              shutil.rmtree(vdir, ignore_errors=True)
              shutil.rmtree(assembled, ignore_errors=True)
              print(f"BUILT {out_ipa.name} successfully!", flush=True)

          build_ipa_variant("gles3", True, Path("GB27-Only-OpenGLES3.ipa"))
          build_ipa_variant("vkfix", False, Path("GB27-Only-VulkanMediaFix.ipa"))

      - name: Step 4 - Upload GB27 Only OpenGLES3 IPA (Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: 1-GB27-Only-OpenGLES3-IPA
          path: GB27-Only-OpenGLES3.ipa

      - name: Step 5 - Upload GB27 Only VulkanMediaFix IPA (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: 2-GB27-Only-VulkanMediaFix-IPA
          path: GB27-Only-VulkanMediaFix.ipa
