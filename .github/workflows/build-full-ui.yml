name: Inspect Layout and Source Config

on:
  push:
  workflow_dispatch:

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Step 2 - Check Build Scripts and Layout Files
        run: |
          echo "=== Project Root Files ==="
          ls -la
          echo "=== Tools and Scripts ==="
          find . -maxdepth 4 -name "*.py" -o -name "CMakeLists.txt" -o -name "*.json" -o -name "*.plist"
          REL_PY=$(find . -name "install-release.py" | head -n 1)
          if [ -n "$REL_PY" ]; then
            echo "=== Found install-release.py ==="
            cat "$REL_PY"
          fi

      - name: Step 3 - Check Bundle Layout Metadata inside Official IPA
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y unzip curl jq
          API="https://api.github.com/repos/imxieyi/Kernarium/releases"
          Q='[.[] | .assets[]? | select(.name | endswith(".ipa")) | .browser_download_url][0]'
          IPA_URL=$(curl -sL "$API" | jq -r "$Q")
          curl -fL -o Andarium.ipa "$IPA_URL"
          mkdir -p work
          unzip -q -o Andarium.ipa -d work
          echo "=== Files inside App Bundle ==="
          find work/Payload -maxdepth 3
          grep -rn "1048506368" work/Payload/ || true
          exit 0
