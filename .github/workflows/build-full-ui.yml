name: Build Custom UI & Clean IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-custom-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Official IPA
        run: |
          set +e
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs libplist-utils unzip zip wget curl jq python3

          mkdir -p work
          REL_JSON=$(curl -s https://api.github.com/repos/imxieyi/Kernarium/releases)
          IPA_URL=$(echo "$REL_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            IPA_URL="https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          fi
          wget -q -O Andarium.ipa "$IPA_URL" || curl -L -o Andarium.ipa "$IPA_URL"
          unzip -q Andarium.ipa -d work
          exit 0

      - name: Step 2 - Unlock Info.plist (Enable Files Folder & Fix Greyed-Out APK)
        run: |
          set +e
          APP_DIR=$(find work/Payload -maxdepth 1 -name "*.app" | head -n 1)
          PLIST="$APP_DIR/Info.plist"
          # แปลง Info.plist เป็น XML เพื่อเพิ่มสิทธิ์เปิดโฟลเดอร์ในแอป Files และปลดล็อกนามสกุล .apk
          plistutil -i "$PLIST" -o "$PLIST.xml" -f xml 2>/dev/null || cp "$PLIST" "$PLIST.xml"
          python3 -c '
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              data = plistlib.load(f)
          data["UIFileSharingEnabled"] = True
          data["LSSupportsOpeningDocumentsInPlace"] = True
          data["UISupportsDocumentBrowser"] = True
          data["UTImportedTypeDeclarations"] = [{
              "UTTypeIdentifier": "com.android.package-archive",
              "UTTypeDescription": "Android Package",
              "UTTypeConformsTo": ["public.data", "public.archive", "public.item", "public.content"],
              "UTTypeTagSpecification": {
                  "public.filename-extension": ["apk", "APK"],
                  "public.mime-type": ["application/vnd.android.package-archive", "application/octet-stream"]
              }
          }]
          with open(p, "wb") as f:
              plistlib.dump(data, f)
          print("Successfully unlocked Info.plist for .apk selection and Files app folder!")
          ' "$PLIST"
          exit 0

      - name: Step 3 - Safe In-Place Debloat & Rockstar UI (Exact 1048506368 Bytes)
        run: |
          set +e
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          ORIG_SIZE=$(stat -c%s "$SYS_IMG")
          ORIG_KB=$((ORIG_SIZE / 1024))

          python3 -c '
          html = """<!DOCTYPE html>
          <html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Game Launcher</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:-apple-system,sans-serif}
          body{width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 75% 25%,#5a3825 0%,#141419 70%);color:#fff;display:flex}
          .sidebar{width:68px;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;padding:20px 0;border-right:1px solid rgba(255,255,255,0.1)}
          .logo-box{width:40px;height:40px;background:#ff9500;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:18px;margin-bottom:24px}
          .game-icon{width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:8px;border-left:4px solid #ff9500;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
          .main{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:24px 44px 70px 44px;position:relative}
          .topnav{display:flex;justify-content:flex-end;align-items:center;gap:32px;font-size:16px;font-weight:600}
          .tab{color:rgba(255,255,255,0.6);cursor:pointer}
          .tab.active{color:#fff;font-weight:800;border-bottom:2px solid #ff9500;padding-bottom:4px}
          .content-row{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-top:auto}
          .left-col{display:flex;flex-direction:column;gap:20px}
          .game-title{font-size:62px;font-weight:900;text-shadow:0 4px 12px rgba(0,0,0,0.8);line-height:1}
          .game-sub{font-size:24px;font-weight:800;color:#ff3b30;letter-spacing:4px}
          .play-btn{width:280px;height:58px;background:linear-gradient(180deg,#fff 0%,#dcdcdc 100%);color:#000;border:none;border-radius:6px;border-bottom:4px solid #ff9500;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
          .cards{display:flex;gap:18px}
          .card{width:230px;height:270px;border-radius:6px;background:linear-gradient(180deg,rgba(255,149,0,0.25) 0%,rgba(0,0,0,0.92) 100%);border:1px solid rgba(255,255,255,0.2);display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:pointer;overflow:hidden}
          .card.selected{border:3px solid #ff9500;box-shadow:0 0 20px rgba(255,149,0,0.4)}
          .badge{position:absolute;top:10px;right:10px;background:#fff;color:#000;font-size:12px;font-weight:800;padding:4px 10px;border-radius:4px}
          .fps-num{font-size:64px;font-weight:900;padding:0 16px;line-height:1}
          .fps-num span{font-size:20px;margin-left:4px}
          .card-desc{background:rgba(0,0,0,0.88);padding:12px 14px;font-size:13px;font-weight:700;margin-top:8px}
          .status-pill{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);color:#000;padding:8px 20px;border-radius:24px;font-weight:700;font-size:13px}
          </style></head><body>
          <div class="sidebar"><div class="logo-box">F2</div><div class="game-icon">GB27</div></div>
          <div class="main">
            <div class="status-pill" id="st">Game Mode Ready (60 FPS)</div>
            <div class="topnav"><div class="tab active">เกม</div><div class="tab">ม็อด</div><div class="tab">ข้อมูล</div><div class="tab">การตั้งค่า</div></div>
            <div class="content-row">
              <div class="left-col"><div><div class="game-title">GOREBOX</div><div class="game-sub">ANIMOSITY 27</div></div><button class="play-btn" onclick="go()">▶ เล่น</button></div>
              <div class="cards">
                <div class="card" onclick="sel(0)"><div class="fps-num">30<span>FPS</span></div><div class="card-desc">ประหยัดแบตเตอรี่: เครื่องเย็น</div></div>
                <div class="card" onclick="sel(1)"><div class="badge">แนะนำ</div><div class="fps-num">30<span>FPS</span></div><div class="card-desc">สมดุล: พื้นผิวสูงและเงาสูง</div></div>
                <div class="card selected" onclick="sel(2)"><div class="badge">ลื่นสุด</div><div class="fps-num">60<span>FPS</span></div><div class="card-desc">ประสิทธิภาพ: 60 FPS</div></div>
              </div>
            </div>
          </div>
          <script>
          function sel(n){var c=document.querySelectorAll(".card");for(var i=0;i<c.length;i++){c[i].classList.toggle("selected",i===n);}}
          function go(){window.location.href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.F2Games.GBDE;end";}
          </script></body></html>"""
          open("/tmp/index.html", "w").write(html.strip())
          '

          printf "on property:sys.boot_completed=1\n    exec - root root -- /system/bin/sh -c \"settings put global window_animation_scale 0 && settings put global transition_animation_scale 0 && settings put global animator_duration_scale 0 && am start -a android.intent.action.VIEW -d file:///system/etc/custom_launcher/index.html\"\n" > /tmp/autostart_ui.rc

          dd if=/dev/zero bs=1M count=800 >> "$SYS_IMG"
          sudo e2fsck -f -y "$SYS_IMG"
          sudo resize2fs -f "$SYS_IMG"
          sudo e2fsck -E unshare_blocks -f -y "$SYS_IMG"
          sudo tune2fs -O ^read-only "$SYS_IMG"
          sudo resize2fs -f "$SYS_IMG"

          sudo mkdir -p /mnt/android
          if sudo mount -o loop,rw "$SYS_IMG" /mnt/android; then
            if [ -d "/mnt/android/system/app" ]; then SR="/mnt/android/system"; else SR="/mnt/android"; fi
            sudo rm -rf "$SR"/product/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LatinIME}
            sudo rm -rf "$SR"/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LiveWallpapersPicker,PhotoTable,BasicDreams,BookmarkProvider,BuiltInPrintService,EasterEgg,PrintSpooler,SimAppDialog,Stk,WallpaperBackup}
            sudo rm -rf "$SR"/media/bootanimation.zip "$SR"/product/media/bootanimation.zip
            sudo rm -rf "$SR"/media/audio/{alarms,notifications,ringtones} "$SR"/product/media/audio/{alarms,notifications,ringtones}
            sudo rm -rf "$SR"/tts "$SR"/product/tts
            sudo rm -f "$SR"/fonts/NotoSansCJK* "$SR"/fonts/NotoSerifCJK*

            if [ -f "$SR/build.prop" ]; then
              sudo cp -a "$SR/build.prop" /tmp/bp.bak
              printf "\ndebug.sf.nobootanimation=1\nro.surface_flinger.max_frame_buffer_acquired_buffers=3\n" | sudo tee -a "$SR/build.prop" > /dev/null
              sudo chcon --reference=/tmp/bp.bak "$SR/build.prop"
            fi

            sudo mkdir -p "$SR/etc/custom_launcher" "$SR/etc/init"
            sudo cp /tmp/index.html "$SR/etc/custom_launcher/index.html"
            sudo cp /tmp/autostart_ui.rc "$SR/etc/init/autostart_ui.rc"
            sudo chmod 755 "$SR/etc/custom_launcher"
            sudo chmod 644 "$SR/etc/custom_launcher/index.html" "$SR/etc/init/autostart_ui.rc"
            sudo chcon -R --reference="$SR/etc" "$SR/etc/custom_launcher"
            sudo chcon --reference="$SR/etc/init" "$SR/etc/init/autostart_ui.rc"

            sync
            sudo umount /mnt/android

            sudo e2fsck -f -y "$SYS_IMG"
            sudo resize2fs -f -M "$SYS_IMG"
            sudo e2fsck -f -y "$SYS_IMG"
            sudo resize2fs -f "$SYS_IMG" "${ORIG_KB}K"
            sudo e2fsck -f -y "$SYS_IMG"
          fi

          truncate -s "$ORIG_SIZE" "$SYS_IMG"
          exit 0

      - name: Step 4 - Repackage IPA
        run: |
          cd work
          zip -q -r -y ../CustomUI-Game.ipa Payload

      - name: Step 5 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomUI-Game-IPA
          path: CustomUI-Game.ipa
