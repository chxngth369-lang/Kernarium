name: Build Ultra Low RAM Android IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-lowram-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Official IPA
        run: |
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs unzip zip wget curl jq

          mkdir -p work
          REL_JSON=$(curl -s https://api.github.com/repos/imxieyi/Kernarium/releases)
          IPA_URL=$(echo "$REL_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            IPA_URL="https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          fi
          wget -q -O Andarium.ipa "$IPA_URL" || curl -L -o Andarium.ipa "$IPA_URL"
          unzip -q Andarium.ipa -d work

      - name: Step 2 - Ultra Low-RAM Mod (Keep APK Installer 100% Intact)
        run: |
          set +e
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          ORIG_SIZE=$(stat -c%s "$SYS_IMG")
          ORIG_KB=$((ORIG_SIZE / 1024))
          echo "Original system.img: $ORIG_SIZE bytes ($ORIG_KB KiB)"

          dd if=/dev/zero bs=1M count=800 >> "$SYS_IMG"
          sudo e2fsck -f -y "$SYS_IMG"
          sudo resize2fs -f "$SYS_IMG"
          sudo e2fsck -E unshare_blocks -f -y "$SYS_IMG"
          sudo tune2fs -O ^read-only -m 0 "$SYS_IMG"
          sudo resize2fs -f "$SYS_IMG"

          sudo mkdir -p /mnt/android
          if ! sudo mount -o loop,rw "$SYS_IMG" /mnt/android; then
            echo "ERROR: Failed to mount system.img RW!"
            exit 1
          fi

          if [ -d "/mnt/android/system/app" ]; then
            SR="/mnt/android/system"
          else
            SR="/mnt/android"
          fi

          # 1) ลบแอปติดเครื่องที่เห็นในคลิปและไฟล์ฟอนต์/เสียงขนาดใหญ่ (ไม่แตะต้องระบบติดตั้ง APK)
          sudo rm -rf "$SR"/product/app/{Aperture,Camera2,Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Music,Glimpse,Gallery2,Recorder,Email,Jelly,Browser2}
          sudo rm -rf "$SR"/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Music,Glimpse,Gallery2,Recorder,Email,PhotoTable,BasicDreams,LiveWallpapersPicker,EasterEgg}
          sudo rm -rf "$SR"/media/bootanimation.zip "$SR"/product/media/bootanimation.zip
          sudo rm -rf "$SR"/media/audio/{alarms,notifications,ringtones} "$SR"/product/media/audio/{alarms,notifications,ringtones}
          sudo rm -rf "$SR"/tts "$SR"/product/tts
          sudo rm -f "$SR"/fonts/NotoSansCJK* "$SR"/fonts/NotoSerifCJK* "$SR"/product/fonts/NotoSansCJK*
          sudo rm -f "$SR"/recovery-from-boot.p "$SR"/etc/recovery-resource.dat

          # 2) เปิดโหมด Android Go ประหยัด RAM ขั้นสุดใน build.prop ทุกจุด
          for BP in "$SR/build.prop" "$SR/product/etc/build.prop" "$SR/system_ext/etc/build.prop"; do
            if [ -f "$BP" ]; then
              sudo cp -a "$BP" /tmp/bp.ref
              printf "\nro.config.low_ram=true\nro.lmk.kill_heaviest_task=false\nro.sys.fw.bg_apps_limit=1\nro.config.max_starting_bg=1\ndalvik.vm.heapstartsize=4m\ndalvik.vm.heapgrowthlimit=96m\ndalvik.vm.heapsize=192m\ndebug.sf.nobootanimation=1\nro.surface_flinger.max_frame_buffer_acquired_buffers=2\n" | sudo tee -a "$BP" > /dev/null
              sudo chcon --reference=/tmp/bp.ref "$BP"
              rm -f /tmp/bp.ref
            fi
          done

          # 3) ปรับจูน Kernel VM คืน RAM ทันทีหลังบูตและเปิด ZRAM อัตโนมัติ
          REF_RC=$(find "$SR/etc/init" -maxdepth 1 -name "*.rc" | head -n 1)
          printf "on init\n    write /proc/sys/vm/overcommit_memory 1\n    write /proc/sys/vm/swappiness 100\n    write /proc/sys/vm/vfs_cache_pressure 200\n\non property:sys.boot_completed=1\n    write /proc/sys/vm/drop_caches 3\n    write /proc/sys/vm/compact_memory 1\n    write /sys/block/zram0/disksize 1073741824\n" | sudo tee "$SR/etc/init/init.lowram.rc" > /dev/null
          sudo chmod 644 "$SR/etc/init/init.lowram.rc"
          if [ -n "$REF_RC" ]; then
            sudo chcon --reference="$REF_RC" "$SR/etc/init/init.lowram.rc"
          else
            sudo chcon --reference="$SR/build.prop" "$SR/etc/init/init.lowram.rc"
          fi

          df -h /mnt/android
          sudo e4defrag /mnt/android >/dev/null 2>&1 || true
          sync
          sudo umount /mnt/android

          # 4) หดพาร์ทิชันกลับไปที่ขนาด 1048506368 bytes เป๊ะๆ แบบไม่ตัดโดนข้อมูล
          sudo e2fsck -f -y "$SYS_IMG"
          sudo resize2fs -f -M "$SYS_IMG"
          sudo e2fsck -f -y "$SYS_IMG"

          if ! sudo resize2fs -f "$SYS_IMG" "${ORIG_KB}K"; then
            echo "ERROR: Could not fit into $ORIG_KB KiB!"
            exit 1
          fi
          sudo e2fsck -f -y "$SYS_IMG"
          sudo tune2fs -O read-only "$SYS_IMG"
          truncate -s "$ORIG_SIZE" "$SYS_IMG"

          FINAL_SIZE=$(stat -c%s "$SYS_IMG")
          echo "Verified exact size: $FINAL_SIZE bytes"
          if [ "$FINAL_SIZE" != "$ORIG_SIZE" ]; then
            exit 1
          fi

      - name: Step 3 - Repackage IPA
        run: |
          cd work
          zip -q -r -y ../UltraLowRAM-Andarium.ipa Payload

      - name: Step 4 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraLowRAM-Andarium-IPA
          path: UltraLowRAM-Andarium.ipa
