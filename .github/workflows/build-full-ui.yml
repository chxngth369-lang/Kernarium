name: Inspect Kernarium iOS UI Source

on:
  push:
  workflow_dispatch:

jobs:
  inspect-ios-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout Kernarium Repository
        uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          path: upstream

      - name: Step 2 - Export iOS SwiftUI Structure and Views
        shell: python3 {0}
        run: |
          from pathlib import Path

          root = Path("upstream")
          out_dir = Path("ios_report")
          out_dir.mkdir(exist_ok=True)

          all_files = sorted(
              str(p.relative_to(root))
              for p in root.rglob("*")
              if p.is_file() and ".git/" not in str(p)
          )
          (out_dir / "repo-files.txt").write_text("\n".join(all_files) + "\n", encoding="utf-8")

          swift_chunks = []
          for rel in all_files:
              low = rel.lower()
              if (
                  low.endswith(".swift")
                  or low.endswith("project.yml")
                  or low.endswith("package.swift")
                  or (".github/workflows/" in low and low.endswith(".yml"))
                  or ("pbxproj" in low)
              ):
                  p = root / rel
                  if p.stat().st_size <= 120000:
                      txt = p.read_text(encoding="utf-8", errors="replace")
                      swift_chunks.append(f"===== FILE: {rel} =====\n{txt}\n")

          joined = "\n".join(swift_chunks)
          # Split if large so easy to upload/read
          max_part = 350000
          if len(joined) <= max_part:
              (out_dir / "ios-swift-sources.txt").write_text(joined, encoding="utf-8")
          else:
              for idx in range(0, len(joined), max_part):
                  part_no = idx // max_part + 1
                  (out_dir / f"ios-swift-sources-part{part_no}.txt").write_text(
                      joined[idx:idx + max_part], encoding="utf-8"
                  )
          print("Exported repo files count:", len(all_files), flush=True)

      - name: Step 3 - Upload iOS UI Report
        uses: actions/upload-artifact@v4
        with:
          name: Kernarium-iOS-UI-Report
          path: ios_report/
