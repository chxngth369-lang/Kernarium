name: Build Custom UI & Clean IPA

on:
  push:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK URL (Optional)'
        required: false
        default: ''

jobs:
  build-custom-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Download Official IPA
        run: |
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs android-sdk-libsparse-utils erofs-utils p7zip-full unzip zip wget curl jq

          mkdir -p work
          REL_JSON=$(curl -s https://api.github.com/repos/imxieyi/Kernarium/releases)
          IPA_URL=$(echo "$REL_JSON" | jq -r '.[0].assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            IPA_URL="https://github.com/imxieyi/Kernarium/releases/download/1.0b9-beta/Andarium.ipa"
          fi
          wget -q -O Andarium.ipa "$IPA_URL" || curl -L -o Andarium.ipa "$IPA_URL"
          unzip -q Andarium.ipa -d work

      - name: Step 2 - Extract Read-Only, Debloat & Rebuild at Exact 1048506368 Bytes
        run: |
          SYS_IMG=$(find work -name "system.img" | head -n 1)
          ORIG_SIZE=$(stat -c%s "$SYS_IMG")
          echo "Original exact byte size: $ORIG_SIZE"

          sudo mkdir -p /tmp/sys_extract /mnt/android_ro

          # 1) แกะไฟล์จาก system.img แบบ Read-Only (ไม่ใช้ mount -o rw จึงไม่มีวันติด exit code 32!)
          if sudo mount -o loop,ro "$SYS_IMG" /mnt/android_ro 2>/dev/null; then
            echo "Mounted Read-Only successfully! Copying with all SELinux contexts..."
            sudo cp -a /mnt/android_ro/. /tmp/sys_extract/
            sudo umount /mnt/android_ro
          elif command -v fsck.erofs >/dev/null 2>&1 && sudo fsck.erofs --extract=/tmp/sys_extract "$SYS_IMG" 2>/dev/null; then
            echo "Extracted EROFS image with attributes successfully!"
          else
            echo "Using debugfs / 7z fallback..."
            sudo 7z x "$SYS_IMG" -o/tmp/sys_extract -y >/dev/null 2>&1 || true
          fi

          if [ -d "/tmp/sys_extract/system/app" ]; then
            SYS_ROOT="/tmp/sys_extract/system"
          else
            SYS_ROOT="/tmp/sys_extract"
          fi

          # 2) ลบเฉพาะแอปขยะภายนอกและไฟล์เสียง (ไม่แตะต้อง priv-app เพื่อให้ระบบบูตติด 100%)
          sudo rm -rf "$SYS_ROOT"/product/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email} || true
          sudo rm -rf "$SYS_ROOT"/app/{Etar,Calendar,DeskClock,ExactCalculator,Contacts,Messaging,Eleven,Glimpse,Gallery2,Recorder,Email,LiveWallpapersPicker,PhotoTable,BasicDreams,EasterEgg,WallpaperBackup} || true
          sudo rm -rf "$SYS_ROOT"/media/bootanimation.zip "$SYS_ROOT"/product/media/bootanimation.zip || true
          sudo rm -rf "$SYS_ROOT"/media/audio/{alarms,notifications,ringtones} "$SYS_ROOT"/product/media/audio/{alarms,notifications,ringtones} || true

          # 3) ปรับค่าความลื่นใน build.prop
          if [ -f "$SYS_ROOT/build.prop" ]; then
            printf "\ndebug.sf.nobootanimation=1\nro.config.low_ram=true\n" | sudo tee -a "$SYS_ROOT/build.prop" > /dev/null
          fi

          # 4) ใส่หน้า UI เข้าเกมและคัดลอกป้ายกำกับ SELinux จากไฟล์ระบบเดิม
          sudo mkdir -p "$SYS_ROOT/etc/custom_launcher" "$SYS_ROOT/etc/init"
          UI_B64=""
          echo "$UI_B64" | base64 -d | sudo tee "$SYS_ROOT/etc/custom_launcher/index.html" > /dev/null
          sudo chmod 755 "$SYS_ROOT/etc/custom_launcher"
          sudo chmod 644 "$SYS_ROOT/etc/custom_launcher/index.html"
          sudo chcon -R --reference="$SYS_ROOT/build.prop" "$SYS_ROOT/etc/custom_launcher" 2>/dev/null || true

          printf "on property:sys.boot_completed=1\n    exec - root root -- /system/bin/sh -c \"wm density 140 && settings put global window_animation_scale 0 && settings put global transition_animation_scale 0 && settings put global animator_duration_scale 0 && am start -a android.intent.action.VIEW -d file:///system/etc/custom_launcher/index.html\"\n" | sudo tee "$SYS_ROOT/etc/init/autostart_ui.rc" > /dev/null
          sudo chmod 644 "$SYS_ROOT/etc/init/autostart_ui.rc"
          sudo chcon --reference="$SYS_ROOT/build.prop" "$SYS_ROOT/etc/init/autostart_ui.rc" 2>/dev/null || true

          # 5) สร้างไฟล์ system.img ก้อนใหม่ให้มีขนาดเท่ากับ $ORIG_SIZE (1048506368 bytes) เป๊ะๆ ทุกไบต์!
          rm -f "$SYS_IMG"
          truncate -s "$ORIG_SIZE" "$SYS_IMG"
          sudo mkfs.ext4 -F -b 4096 -L "/" -O ^has_journal -d /tmp/sys_extract "$SYS_IMG"
          sudo e2fsck -f -y "$SYS_IMG" || true
          truncate -s "$ORIG_SIZE" "$SYS_IMG"

          FINAL_SIZE=$(stat -c%s "$SYS_IMG")
          echo "Verified exact byte size: $FINAL_SIZE (Target: $ORIG_SIZE)"

      - name: Step 3 - Repackage IPA (Preserve Symlinks)
        run: |
          cd work
          zip -q -r -y ../CustomUI-Game.ipa Payload

      - name: Step 4 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomUI-Game-IPA
          path: CustomUI-Game.ipa
